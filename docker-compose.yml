# Usage:  docker compose up --build
#   web app -> http://localhost:8501        REST API -> http://localhost:8000/docs
# Put your LLM settings in a .env file next to this file (same names as .env.example).
services:
  app:
    build: .
    ports: ["8501:8501"]
    env_file: [.env]
    environment:
      DB_PATH: /app/storage/insights.db
    volumes: ["./storage:/app/storage"]
  api:
    build: .
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      DB_PATH: /app/storage/insights.db
    volumes: ["./storage:/app/storage"]
